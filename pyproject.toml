[project]
name = "inventree-mcp"
version = "1.0.0"
description = "MCP server for InvenTree inventory management — 12 tools, 117 operations"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "inventree>=0.22.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "client.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
